name: Gallery Submission

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

# 同一个 Issue 的重复触发（opened + labeled）串行执行，避免两个 PR 打架
concurrency:
  group: gallery-submission-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  process-submission:
    # 仅处理带 gallery-submission 标签的 Issue
    # opened：模板自动带标签；labeled：事后补标签也能触发
    if: contains(github.event.issue.labels.*.name, 'gallery-submission')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      # 投稿处理需要 sharp 重新编码图片（生成 webp 变体）
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check R2 secrets
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ]; then
            echo "::error::缺少 R2 secrets（R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ENDPOINT / R2_BUCKET / R2_PUBLIC_BASE），请先在仓库 Settings → Secrets and variables → Actions 配置。"
            exit 1
          fi

      - name: Process submission
        id: process
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
        run: node .github/scripts/process-gallery-submission.mjs

      - name: Create Pull Request
        if: steps.process.outputs.has-images == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          branch="gallery-submission-${ISSUE_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          # 图片已经在 R2 上，仓库里只留下 settings.json 的地址记录
          git add settings.json
          git commit -m "Add gallery images from #${ISSUE_NUMBER}"
          git push origin "$branch" --force-with-lease
          gh pr create \
            --title "Add gallery images from #${ISSUE_NUMBER}" \
            --body-file pr-body.md \
            --head "$branch" \
            --base "${{ github.event.repository.default_branch }}" \
            --label "gallery-submission"
